<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning hub</title>
  <meta name="description" content="A learning hub: roadmaps, interview preparation with AI mock interviews, daily coding practice, tasks and a study calendar.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Learning hub">
  <meta property="og:title" content="Learning hub">
  <meta property="og:url" content="https://roadmaps-tracker.vercel.app/">
  <link rel="canonical" href="https://roadmaps-tracker.vercel.app/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #f6f5f1; }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #111211; } }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #111211; }
  </style>
  <script>try{var t=localStorage.getItem('rt:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
  <noscript>This app needs JavaScript.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

</html>
