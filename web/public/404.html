<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Learning hub</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f6f5f1; --paper: #fff; --text: #1c1b19; --muted: #5f5d57; --border: #e4e2dc; --accent: #0f766e; --on: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111211; --paper: #1a1b19; --text: #ecebe6; --muted: #a3a19a; --border: #2c2d2a; --accent: #3cc0a6; --on: #0d1f1c; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 440px; width: 100%; text-align: center; background: var(--paper); border: 1px solid var(--border); border-radius: 14px; padding: 40px 28px; }
    .code { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; color: var(--accent); margin: 0; line-height: 1; }
    h1 { font-size: 1.4rem; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 9px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; border: 1px solid var(--border); color: var(--text); }
    a.primary { background: var(--accent); border-color: var(--accent); color: var(--on); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be old, or the address has a typo.</p>
    <div class="row">
      <a class="primary" href="/">Go to the home page</a>
      <a href="/#/roadmaps">Browse roadmaps</a>
    </div>
  </main>
</body>
</html>
